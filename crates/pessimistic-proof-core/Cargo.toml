[package]
name = "pessimistic-proof-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["sp1"]
# zkVM backends that verify aggchain proofs inside the guest. A zkVM build
# enables exactly one of them.
sp1 = ["dep:sp1-zkvm"]
zisk = [
    "dep:slop-algebra",
    "dep:sp1-hypercube",
    "dep:sp1-primitives",
    "dep:sp1-recursion-executor",
    "dep:sp1-verifier",
    "dep:ziskos",
]
testutils = [
    "agglayer-primitives/testutils",
    "unified-bridge/testutils",
    "alloy-primitives/arbitrary",
    "dep:arbitrary",
    "dep:rand",
]

[dependencies]
agglayer-bincode.workspace = true
agglayer-primitives.workspace = true
agglayer-tries.workspace = true
unified-bridge.workspace = true

alloy-primitives.workspace = true
arbitrary = { workspace = true, optional = true }
hex = "0.4.3"
hex-literal = "1.1"
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3" }
thiserror = "2.0.18"
rand = { version = "0.9.0", optional = true }
sp1-zkvm = { workspace = true, features = ["verify"], optional = true }
# ZisK backend: verifies SP1 compressed aggchain proofs in software.
slop-algebra = { workspace = true, optional = true }
sp1-hypercube = { workspace = true, optional = true }
sp1-primitives = { workspace = true, optional = true }
sp1-recursion-executor = { workspace = true, optional = true }
sp1-verifier = { workspace = true, optional = true }
ziskos = { workspace = true, optional = true }

[dev-dependencies]
alloy.workspace = true
unified-bridge = { workspace = true, features = ["testutils"] }
rand = "0.9.0"
rstest.workspace = true

[build-dependencies]
semver = "1.0"
toml.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["sp1-zkvm", "ziskos"]
