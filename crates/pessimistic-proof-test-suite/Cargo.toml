[package]
name = "pessimistic-proof-test-suite"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ppgen"
path = "src/bin/ppgen.rs"

[[bin]]
name = "convertor"
path = "src/bin/convertor.rs"

[[bin]]
name = "zisk-inputs"
path = "src/bin/zisk_inputs.rs"

[[bin]]
name = "zisk-prove"
path = "src/bin/zisk_prove.rs"

[dependencies]
agglayer-tries.workspace = true
agglayer-types = { workspace = true, features = ["testutils"] }
unified-bridge.workspace = true
prover-executor.workspace = true
pessimistic-proof = { path = "../pessimistic-proof" }
ecdsa-proof-lib = { path = "./aggchain-proof-ecdsa-example/lib/" }

alloy.workspace = true
base64.workspace = true
clap.workspace = true
eyre.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sp1-sdk = { workspace = true }
sp1-prover.workspace = true
sp1-core-machine.workspace = true
lazy_static.workspace = true
rand.workspace = true
hex-literal = "1.1"
hex.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1.22.0", features = ["v4", "fast-rng"] }
regex = "1.12"
bincode1 = { package = "bincode", version = "1.3" }
reqwest.workspace = true
rustls.workspace = true
zstd = "0.13"
zisk-core.workspace = true
zisk-sdk.workspace = true
zisk-transpiler-common.workspace = true
ziskemu.workspace = true

[dev-dependencies]
insta.workspace = true
toml.workspace = true
rstest.workspace = true
tracing.workspace = true
